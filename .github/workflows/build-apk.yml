name: Build Android APK

on:
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub
  push:
    branches: [ "main", "master" ] # Tự động chạy ngay khi đẩy code lên nhánh main hoặc master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Cài đặt thư viện Capacitor
        run: npm install
        
      - name: Build APK (Sử dụng máy chủ GitHub)
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Trả về file APK cho bạn tải xuống
        uses: actions/upload-artifact@v3
        with:
          name: WearConnect-App
          path: android/app/build/outputs/apk/debug/app-debug.apk